name: Deploy Templates to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build all three
        run: |
          mkdir -p dist
          for i in 1 2 3; do
            cd proj_hair_transplant_${i}_up/vue-project
            npm ci
            npm run build
            mkdir -p "$GITHUB_WORKSPACE/dist/proj_hair_transplant_${i}_up"
            cp -r dist/* "$GITHUB_WORKSPACE/dist/proj_hair_transplant_${i}_up/"
            cd "$GITHUB_WORKSPACE"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
